<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Budget Planner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--bd:#e3e6eb;--ac:#3b6cf6;--ok:#17a34a;--bad:#dc2626;--wn:#d97706;--tr:#e9ecf1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eceff3;--mu:#98a1ae;--bd:#2b323b;--ac:#6f93ff;--ok:#34d27b;--bad:#f87171;--wn:#fbbf24;--tr:#2b323b}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eceff3;--mu:#98a1ae;--bd:#2b323b;--ac:#6f93ff;--ok:#34d27b;--bad:#f87171;--wn:#fbbf24;--tr:#2b323b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--mu);font-weight:400;font-size:12px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
.nm{flex:1}.amt{width:100px;text-align:right}
.x{background:none;border:0;color:var(--mu);font-size:22px;padding:4px 8px;cursor:pointer}
.add{margin-top:10px;background:none;border:1px dashed var(--bd);color:var(--ac);border-radius:10px;padding:9px;width:100%;font:inherit;cursor:pointer}
.tot{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);font-size:14px;color:var(--mu)}
.big{font-size:34px;font-weight:700;margin:2px 0}
.stats{display:flex;gap:16px;color:var(--mu);font-size:14px}
.stats b{color:var(--tx)}
.bar{height:10px;background:var(--tr);border-radius:6px;position:relative;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.5}
.bl{font-size:13px;color:var(--mu);margin-top:10px;display:flex;justify-content:space-between}
.tip{margin-top:12px;font-size:14px;padding:10px;border-radius:10px;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pdf{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:14px}.pdf[hidden]{display:none}
@media print{.pdf,.reset,.add,.x,#cur{display:none!important}body{background:#fff}}
.reset{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Student Budget Planner</h1><p class="sub">Monthly budget · saves on this device</p></div>
    <select id="cur" aria-label="Currency"><option>₱</option><option>$</option><option>£</option><option>€</option><option>₹</option><option>¥</option></select>
  </div>

  <div class="card" id="sum"></div>
  <button class="pdf">Save as PDF</button>
  <div id="sections"></div>
  <button class="pdf">Tapos na? Save as PDF</button>
  <button class="reset" id="reset">Reset everything</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var G=[["need","Needs","aim ≤ 50% of income",50],["want","Wants","aim ≤ 30% of income",30],["save","Savings & debt","aim ≥ 20% of income",20]];
function def(){return{cur:"₱",inc:[["Loan / grant / scholarship",""],["Family support",""],["Part-time job",""],["Other income",""]],
exp:[["Rent / accommodation","","need"],["Utilities & internet","","need"],["Groceries","","need"],["Transport","","need"],["Phone","","need"],["Books & course costs","","need"],["Health & insurance","","need"],
["Eating out & coffee","","want"],["Entertainment & going out","","want"],["Subscriptions","","want"],["Clothes & personal care","","want"],["Hobbies & travel","","want"],
["Emergency fund","","save"],["Loan / debt repayment","","save"]]}}
var D=def();
try{var s=localStorage.getItem("sbp1");if(s){var o=JSON.parse(s);if(!o.cc)o.cur="₱";D=Object.assign(def(),o)}}catch(e){}
function persist(){try{localStorage.setItem("sbp1",JSON.stringify(D))}catch(e){}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function n(v){v=parseFloat(v);return isNaN(v)||v<0?0:v}
function f(v){return (v<0?"-":"")+D.cur+Math.round(Math.abs(v)).toLocaleString()}
function row(k,i,r){return '<div class="row"><input class="nm" data-k="'+k+'" data-i="'+i+'" data-f="0" value="'+esc(r[0])+'" aria-label="Name"><input class="amt" type="number" inputmode="decimal" min="0" placeholder="0" data-k="'+k+'" data-i="'+i+'" data-f="1" value="'+esc(r[1])+'" aria-label="Amount"><button class="x" data-del="'+k+'" data-i="'+i+'" aria-label="Remove">×</button></div>'}
function render(){
  var h='<div class="card"><h2>Income <small>per month, after tax</small></h2>';
  D.inc.forEach(function(r,i){h+=row("inc",i,r)});
  h+='<button class="add" data-add="inc">+ Add income</button><div class="tot"><span>Total income</span><b id="t-inc"></b></div></div>';
  G.forEach(function(g){
    h+='<div class="card"><h2>'+g[1]+' <small>'+g[2]+'</small></h2>';
    D.exp.forEach(function(r,i){if(r[2]===g[0])h+=row("exp",i,r)});
    h+='<button class="add" data-add="'+g[0]+'">+ Add item</button><div class="tot"><span>Total '+g[1].toLowerCase()+'</span><b id="t-'+g[0]+'"></b></div>
